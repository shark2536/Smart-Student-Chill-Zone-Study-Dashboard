<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Student Chill Zone & Study Dashboard</title>

    <!-- Typography: SF Pro Display / Inter Fallback via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons: FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Micro-Confetti Library (Optional Visual FX on Completion) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* ==========================================================================
           1. CSS VARIABLES & SYSTEM THEMING (APPLE HIG PALETTE)
           ========================================================================== */
        :root {
            /* Light Theme (Default Apple Aesthetic) */
            --bg-main: #F5F5F7;
            --surface-card: rgba(255, 255, 255, 0.78);
            --surface-card-hover: rgba(255, 255, 255, 0.92);
            --border-card: rgba(255, 255, 255, 0.8);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.04);
            
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --text-tertiary: #A1A1A6;

            /* Accent Colors */
            --accent-blue: #0071E3;
            --accent-blue-hover: #0077ED;
            --accent-green: #34C759;
            --accent-orange: #FF9500;
            --accent-red: #FF3B30;
            --accent-purple: #AF52DE;

            /* Glassmorphism Refraction Tokens */
            --blur-amount: 20px;
            --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.6);
            --input-bg: rgba(0, 0, 0, 0.03);
            --input-border: rgba(0, 0, 0, 0.08);

            /* Transitions */
            --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
            --transition-fast: 0.2s var(--ease-apple);
            --transition-smooth: 0.4s var(--ease-apple);
        }

        [data-theme="dark"] {
            /* Dark Theme Overrides */
            --bg-main: #000000;
            --surface-card: rgba(28, 28, 30, 0.75);
            --surface-card-hover: rgba(44, 44, 46, 0.85);
            --border-card: rgba(255, 255, 255, 0.12);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.37);

            --text-primary: #F5F5F7;
            --text-secondary: #86868B;
            --text-tertiary: #6E6E73;

            --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.15);
            --input-bg: rgba(255, 255, 255, 0.06);
            --input-border: rgba(255, 255, 255, 0.12);
        }

        /* ==========================================================================
           2. GLOBAL BASE STYLES & RESET
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 24px;
            transition: background-color var(--transition-smooth), color var(--transition-smooth);
        }

        /* Base Glass Card Component */
        .glass-card {
            background: var(--surface-card);
            backdrop-filter: blur(var(--blur-amount)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-amount)) saturate(180%);
            border-radius: 20px;
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-card), var(--glass-highlight);
            transition: transform var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast);
        }

        /* Interactive Card State */
        .glass-card-interactive:hover {
            background: var(--surface-card-hover);
            transform: translateY(-2px);
        }

        button {
            font-family: inherit;
            border: none;
            outline: none;
            cursor: pointer;
            border-radius: 999px;
            transition: all var(--transition-fast);
        }

        button:active {
            transform: scale(0.96);
        }

        input, select {
            font-family: inherit;
            outline: none;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            transition: all var(--transition-fast);
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.2);
        }

        /* ==========================================================================
           3. HEADER & DYNAMIC GREETING WIDGET
           ========================================================================== */
        header.dashboard-header {
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .user-greeting {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .greeting-headline {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .editable-name {
            border-bottom: 2px dashed var(--accent-blue);
            cursor: pointer;
            padding: 0 4px;
            border-radius: 4px;
        }

        .editable-name:hover {
            background: rgba(0, 113, 227, 0.1);
        }

        .live-date-subtext {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .live-clock-badge {
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 16px;
            font-weight: 600;
            padding: 8px 16px;
            background: var(--input-bg);
            border-radius: 12px;
            border: 1px solid var(--border-card);
            letter-spacing: 0.05em;
        }

        .theme-toggle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--input-bg);
            border: 1px solid var(--border-card);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .theme-toggle-btn:hover {
            background: var(--surface-card-hover);
            color: var(--accent-blue);
        }

        /* ==========================================================================
           4. MAIN GRID LAYOUT ENGINE
           ========================================================================== */
        main.dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 24px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        .col-span-12 { grid-column: span 12; }
        .col-span-8  { grid-column: span 8; }
        .col-span-6  { grid-column: span 6; }
        .col-span-4  { grid-column: span 4; }

        @media (max-width: 1024px) {
            .col-span-8, .col-span-6, .col-span-4 { grid-column: span 12; }
        }

        /* Section Containers */
        .dashboard-section {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent-blue);
        }

        /* ==========================================================================
           5. APPLE WATCH-STYLE POMODORO TIMER
           ========================================================================== */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        .timer-modes {
            display: flex;
            background: var(--input-bg);
            padding: 4px;
            border-radius: 999px;
            gap: 4px;
            border: 1px solid var(--input-border);
        }

        .mode-btn {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            background: transparent;
            color: var(--text-secondary);
        }

        .mode-btn.active {
            background: var(--surface-card);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .ring-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .ring-bg {
            fill: none;
            stroke: var(--input-border);
            stroke-width: 10;
        }

        .ring-progress {
            fill: none;
            stroke: var(--accent-blue);
            stroke-width: 10;
            stroke-linecap: round;
            stroke-dasharray: 565.48; /* 2 * PI * r (r=90) */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.3s linear, stroke var(--transition-smooth);
        }

        .timer-display-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-text {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -0.03em;
            font-variant-numeric: tabular-nums;
        }

        .timer-state-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .timer-action-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-primary-action {
            background: var(--accent-blue);
            color: #FFFFFF;
            padding: 10px 24px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 14px rgba(0, 113, 227, 0.3);
        }

        .btn-primary-action:hover {
            background: var(--accent-blue-hover);
        }

        .btn-secondary-action {
            background: var(--input-bg);
            color: var(--text-primary);
            padding: 10px 18px;
            font-weight: 500;
            font-size: 14px;
            border: 1px solid var(--input-border);
        }

        /* ==========================================================================
           6. AMBIENT SOUND GENERATOR (CHILL ZONE)
           ========================================================================== */
        .ambient-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .ambient-track-card {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-radius: 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
        }

        .track-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .track-toggle-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface-card);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 1px solid var(--border-card);
        }

        .ambient-track-card.active .track-toggle-btn {
            background: var(--accent-blue);
            color: #FFFFFF;
        }

        .volume-slider-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-slider-wrapper i {
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: var(--input-border);
            padding: 0;
            border: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        /* ==========================================================================
           7. SMART ASSIGNMENT & TASK TRACKER
           ========================================================================== */
        .task-input-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .task-input-form input[type="text"] {
            flex: 2;
            min-width: 180px;
        }

        .task-input-form select {
            flex: 1;
            min-width: 120px;
        }

        .task-input-form input[type="datetime-local"] {
            flex: 1.2;
            min-width: 160px;
        }

        .btn-add-task {
            background: var(--accent-blue);
            color: #FFFFFF;
            padding: 0 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .task-list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 14px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            gap: 12px;
            transition: all var(--transition-fast);
        }

        .task-item:hover {
            border-color: rgba(0, 113, 227, 0.3);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .task-item.completed .task-checkbox {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #FFFFFF;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .task-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .task-meta-details {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .subject-tag {
            background: rgba(0, 113, 227, 0.1);
            color: var(--accent-blue);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        /* Smart Deadline Badges */
        .deadline-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 999px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .badge-red { background: rgba(255, 59, 48, 0.12); color: var(--accent-red); }
        .badge-orange { background: rgba(255, 149, 0, 0.12); color: var(--accent-orange); }
        .badge-green { background: rgba(52, 199, 89, 0.12); color: var(--accent-green); }

        .btn-delete-task {
            background: transparent;
            color: var(--text-tertiary);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .btn-delete-task:hover {
            color: var(--accent-red);
            background: rgba(255, 59, 48, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ==========================================================================
           8. FOOTER
           ========================================================================== */
        footer.dashboard-footer {
            margin-top: auto;
            text-align: center;
            padding: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid var(--input-border);
        }

        footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Dynamic Header -->
    <header class="glass-card dashboard-header">
        <div class="user-greeting">
            <h1 class="greeting-headline">
                <span id="greeting-text">Good Morning</span>, 
                <span id="user-name-display" class="editable-name" title="Click to change name">Student</span>
            </h1>
            <p id="live-date-display" class="live-date-subtext">Loading date...</p>
        </div>

        <div class="header-controls">
            <div id="live-clock" class="live-clock-badge">00:00:00</div>
            <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle Theme">
                <i class="fa-solid me-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="dashboard-grid">

        <!-- Column Left: Pomodoro Timer -->
        <section class="glass-card dashboard-section col-span-4">
            <div class="section-header">
                <h2 class="section-title"><i class="fa-solid fa-stopwatch"></i> Focus Timer</h2>
            </div>

            <div class="timer-container">
                <div class="timer-modes">
                    <button class="mode-btn active" data-mode="focus">Focus</button>
                    <button class="mode-btn" data-mode="shortBreak">Short Break</button>
                    <button class="mode-btn" data-mode="longBreak">Long Break</button>
                </div>

                <div class="ring-wrapper">
                    <svg class="timer-svg" viewBox="0 0 200 200">
                        <circle class="ring-bg" cx="100" cy="100" r="90"></circle>
                        <circle id="timer-progress-ring" class="ring-progress" cx="100" cy="100" r="90"></circle>
                    </svg>
                    <div class="timer-display-content">
                        <span id="timer-countdown" class="time-text">25:00</span>
                        <span id="timer-state-label" class="timer-state-label">Ready</span>
                    </div>
                </div>

                <div class="timer-action-controls">
                    <button id="timer-start-btn" class="btn-primary-action"><i class="fa-solid fa-play"></i> Start</button>
                    <button id="timer-reset-btn" class="btn-secondary-action"><i class="fa-solid fa-rotate-right"></i> Reset</button>
                </div>
            </div>
        </section>

        <!-- Column Right: Task Tracker (Top) & Ambient Sounds (Bottom) -->
        <div class="col-span-8" style="display: flex; flex-direction: column; gap: 24px;">
            
            <!-- Smart Assignment Tracker -->
            <section class="glass-card dashboard-section">
                <div class="section-header">
                    <h2 class="section-title"><i class="fa-solid fa-list-check"></i> Assignments & Tasks</h2>
                </div>

                <!-- Input Form -->
                <form id="task-form" class="task-input-form">
                    <input type="text" id="task-title-input" placeholder="Assignment title..." required>
                    <select id="task-subject-input" required>
                        <option value="" disabled selected>Subject</option>
                        <option value="Math">Math</option>
                        <option value="Programming">Programming</option>
                        <option value="English">English</option>
                        <option value="Science">Science</option>
                        <option value="General">General</option>
                    </select>
                    <input type="datetime-local" id="task-deadline-input" required>
                    <button type="submit" class="btn-add-task"><i class="fa-solid fa-plus"></i> Add</button>
                </form>

                <!-- Task List Area -->
                <div id="task-list-container" class="task-list-container">
                    <!-- Task items injected dynamically by JS -->
                </div>
            </section>

            <!-- Ambient Sound Generator -->
            <section class="glass-card dashboard-section">
                <div class="section-header">
                    <h2 class="section-title"><i class="fa-solid fa-headphones"></i> Chill Zone Soundscape</h2>
                </div>

                <div class="ambient-grid">
                    <!-- Track 1: Rain -->
                    <div class="ambient-track-card" data-track="rain">
                        <div class="track-meta">
                            <span class="track-title"><i class="fa-solid fa-cloud-rain"></i> Heavy Rain</span>
                            <button class="track-toggle-btn" data-track="rain"><i class="fa-solid fa-play"></i></button>
                        </div>
                        <div class="volume-slider-wrapper">
                            <i class="fa-solid fa-volume-low"></i>
                            <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0.5" data-track="rain">
                            <i class="fa-solid fa-volume-high"></i>
                        </div>
                    </div>

                    <!-- Track 2: Waves -->
                    <div class="ambient-track-card" data-track="ocean">
                        <div class="track-meta">
                            <span class="track-title"><i class="fa-solid fa-water"></i> Ocean Waves</span>
                            <button class="track-toggle-btn" data-track="ocean"><i class="fa-solid fa-play"></i></button>
                        </div>
                        <div class="volume-slider-wrapper">
                            <i class="fa-solid fa-volume-low"></i>
                            <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0.5" data-track="ocean">
                            <i class="fa-solid fa-volume-high"></i>
                        </div>
                    </div>

                    <!-- Track 3: Cafe -->
                    <div class="ambient-track-card" data-track="cafe">
                        <div class="track-meta">
                            <span class="track-title"><i class="fa-solid fa-mug-hot"></i> Cozy Cafe</span>
                            <button class="track-toggle-btn" data-track="cafe"><i class="fa-solid fa-play"></i></button>
                        </div>
                        <div class="volume-slider-wrapper">
                            <i class="fa-solid fa-volume-low"></i>
                            <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="0.5" data-track="cafe">
                            <i class="fa-solid fa-volume-high"></i>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- App Footer -->
    <footer class="dashboard-footer">
        <p>Smart Student Chill Zone & Study Dashboard &bull; Designed following Apple HIG Standards</p>
    </footer>

    <!-- ==========================================================================
       JAVASCRIPT ARCHITECTURE & LOGIC (MODULAR/STATE DRIVEN)
       ========================================================================== -->
    <script>
        /**
         * Smart Student Dashboard Engine
         * Built with pure Modular ES6+ JavaScript for SMK & High School Study
         */
        (function SmartDashboardApp() {

            /* ==================================================================
               1. APPLICATION STATE
               ================================================================== */
            const STATE = {
                user: {
                    name: localStorage.getItem('app_user_name') || 'Student'
                },
                theme: localStorage.getItem('app_theme') || 'light',
                timer: {
                    mode: 'focus', // focus | shortBreak | longBreak
                    durations: {
                        focus: 25 * 60,
                        shortBreak: 5 * 60,
                        longBreak: 15 * 60
                    },
                    timeLeft: 25 * 60,
                    isRunning: false,
                    intervalId: null
                },
                tasks: JSON.parse(localStorage.getItem('app_tasks')) || [],
                ambientSounds: {
                    rain: { audio: null, isPlaying: false, url: 'https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3' },
                    ocean: { audio: null, isPlaying: false, url: 'https://cdn.pixabay.com/download/audio/2022/03/24/audio_c8c8a7304b.mp3' },
                    cafe: { audio: null, isPlaying: false, url: 'https://cdn.pixabay.com/download/audio/2021/09/06/audio_83a1a9e88d.mp3' }
                }
            };

            /* ==================================================================
               2. DOM ELEMENTS CACHE
               ================================================================== */
            const DOM = {
                // Header & Greeting
                greetingText: document.getElementById('greeting-text'),
                userNameDisplay: document.getElementById('user-name-display'),
                liveDateDisplay: document.getElementById('live-date-display'),
                liveClock: document.getElementById('live-clock'),
                themeToggleBtn: document.getElementById('theme-toggle-btn'),

                // Timer
                timerCountdown: document.getElementById('timer-countdown'),
                timerStateLabel: document.getElementById('timer-state-label'),
                timerProgressRing: document.getElementById('timer-progress-ring'),
                timerStartBtn: document.getElementById('timer-start-btn'),
                timerResetBtn: document.getElementById('timer-reset-btn'),
                timerModeBtns: document.querySelectorAll('.mode-btn'),

                // Tasks
                taskForm: document.getElementById('task-form'),
                taskTitleInput: document.getElementById('task-title-input'),
                taskSubjectInput: document.getElementById('task-subject-input'),
                taskDeadlineInput: document.getElementById('task-deadline-input'),
                taskListContainer: document.getElementById('task-list-container'),

                // Ambient Audio
                ambientCards: document.querySelectorAll('.ambient-track-card'),
                ambientToggleBtns: document.querySelectorAll('.track-toggle-btn'),
                volumeSliders: document.querySelectorAll('.volume-slider')
            };

            /* ==================================================================
               3. THEME & GREETING LOGIC
               ================================================================== */
            function initTheme() {
                document.documentElement.setAttribute('data-theme', STATE.theme);
                updateThemeToggleIcon();
            }

            function toggleTheme() {
                STATE.theme = STATE.theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('app_theme', STATE.theme);
                document.documentElement.setAttribute('data-theme', STATE.theme);
                updateThemeToggleIcon();
            }

            function updateThemeToggleIcon() {
                const icon = DOM.themeToggleBtn.querySelector('i');
                if (STATE.theme === 'dark') {
                    icon.className = 'fa-solid fa-sun';
                } else {
                    icon.className = 'fa-solid fa-moon';
                }
            }

            function updateClockAndGreeting() {
                const now = new Date();
                
                // Clock (HH:MM:SS)
                DOM.liveClock.textContent = now.toLocaleTimeString('en-US', { hour12: false });

                // Date
                const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
                DOM.liveDateDisplay.textContent = now.toLocaleDateString('en-US', options);

                // Greeting based on hour
                const hour = now.getHours();
                if (hour < 12) STATE.greeting = 'Good Morning';
                else if (hour < 18) STATE.greeting = 'Good Afternoon';
                else STATE.greeting = 'Good Evening';

                DOM.greetingText.textContent = STATE.greeting;
            }

            function setupUserEditing() {
                DOM.userNameDisplay.textContent = STATE.user.name;
                DOM.userNameDisplay.addEventListener('click', () => {
                    const newName = prompt('Enter your preferred name:', STATE.user.name);
                    if (newName && newName.trim() !== '') {
                        STATE.user.name = newName.trim();
                        localStorage.setItem('app_user_name', STATE.user.name);
                        DOM.userNameDisplay.textContent = STATE.user.name;
                    }
                });
            }

            /* ==================================================================
               4. POMODORO TIMER LOGIC
               ================================================================== */
            const RING_CIRCUMFERENCE = 2 * Math.PI * 90; // r = 90

            function renderTimer() {
                const minutes = Math.floor(STATE.timer.timeLeft / 60);
                const seconds = STATE.timer.timeLeft % 60;
                DOM.timerCountdown.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                // Calculate Progress Offset
                const totalDuration = STATE.timer.durations[STATE.timer.mode];
                const progressFraction = STATE.timer.timeLeft / totalDuration;
                const strokeDashoffset = RING_CIRCUMFERENCE * (1 - progressFraction);
                DOM.timerProgressRing.style.strokeDashoffset = strokeDashoffset;
            }

            function startTimer() {
                if (STATE.timer.isRunning) {
                    // Pause action
                    clearInterval(STATE.timer.intervalId);
                    STATE.timer.isRunning = false;
                    DOM.timerStartBtn.innerHTML = '<i class="fa-solid fa-play"></i> Start';
                    DOM.timerStateLabel.textContent = 'Paused';
                    return;
                }

                // Start action
                STATE.timer.isRunning = true;
                DOM.timerStartBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
                DOM.timerStateLabel.textContent = 'Focusing';

                STATE.timer.intervalId = setInterval(() => {
                    if (STATE.timer.timeLeft > 0) {
                        STATE.timer.timeLeft--;
                        renderTimer();
                    } else {
                        // Timer Complete
                        clearInterval(STATE.timer.intervalId);
                        STATE.timer.isRunning = false;
                        playTimerChime();
                        triggerConfetti();
                        alert('Focus session complete! Take a breather.');
                        resetTimer();
                    }
                }, 1000);
            }

            function resetTimer() {
                clearInterval(STATE.timer.intervalId);
                STATE.timer.isRunning = false;
                STATE.timer.timeLeft = STATE.timer.durations[STATE.timer.mode];
                DOM.timerStartBtn.innerHTML = '<i class="fa-solid fa-play"></i> Start';
                DOM.timerStateLabel.textContent = 'Ready';
                renderTimer();
            }

            function switchTimerMode(newMode) {
                STATE.timer.mode = newMode;
                DOM.timerModeBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === newMode);
                });
                resetTimer();
            }

            function playTimerChime() {
                // Web Audio API Synth Chime
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5 tone
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.5);
                } catch (e) {
                    console.log('Audio Context restricted');
                }
            }

            /* ==================================================================
               5. AMBIENT SOUND GENERATOR LOGIC
               ================================================================== */
            function initAmbientSounds() {
                Object.keys(STATE.ambientSounds).forEach(trackKey => {
                    const sound = STATE.ambientSounds[trackKey];
                    sound.audio = new Audio(sound.url);
                    sound.audio.loop = true;
                    sound.audio.volume = 0.5;
                });

                // Attach Event Listeners to UI
                DOM.ambientToggleBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const trackKey = e.currentTarget.dataset.track;
                        toggleAmbientTrack(trackKey);
                    });
                });

                DOM.volumeSliders.forEach(slider => {
                    slider.addEventListener('input', (e) => {
                        const trackKey = e.target.dataset.track;
                        const volume = parseFloat(e.target.value);
                        if (STATE.ambientSounds[trackKey].audio) {
                            STATE.ambientSounds[trackKey].audio.volume = volume;
                        }
                    });
                });
            }

            function toggleAmbientTrack(trackKey) {
                const sound = STATE.ambientSounds[trackKey];
                const card = document.querySelector(`.ambient-track-card[data-track="${trackKey}"]`);
                const btnIcon = card.querySelector('.track-toggle-btn i');

                if (sound.isPlaying) {
                    sound.audio.pause();
                    sound.isPlaying = false;
                    card.classList.remove('active');
                    btnIcon.className = 'fa-solid fa-play';
                } else {
                    sound.audio.play().catch(() => console.log('Audio autoplay prevented'));
                    sound.isPlaying = true;
                    card.classList.add('active');
                    btnIcon.className = 'fa-solid fa-pause';
                }
            }

            /* ==================================================================
               6. TASK TRACKER & STORAGE INTEGRATION
               ================================================================== */
            function renderTasks() {
                DOM.taskListContainer.innerHTML = '';

                if (STATE.tasks.length === 0) {
                    DOM.taskListContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-regular fa-calendar-check" style="font-size: 24px; margin-bottom: 8px;"></i>
                            <p>No assignments queued up. All caught up!</p>
                        </div>
                    `;
                    return;
                }

                STATE.tasks.forEach((task, index) => {
                    const taskEl = document.createElement('div');
                    taskEl.className = `task-item ${task.completed ? 'completed' : ''}`;

                    // Calculate Smart Deadline Status
                    const deadlineBadge = getDeadlineBadge(task.deadline);

                    taskEl.innerHTML = `
                        <div class="task-left">
                            <div class="task-checkbox" onclick="window.appToggleTask(${index})">
                                ${task.completed ? '<i class="fa-solid fa-check" style="font-size: 10px;"></i>' : ''}
                            </div>
                            <div class="task-info">
                                <span class="task-title">${escapeHtml(task.title)}</span>
                                <div class="task-meta-details">
                                    <span class="subject-tag">${escapeHtml(task.subject)}</span>
                                    <span>${formatDeadline(task.deadline)}</span>
                                </div>
                            </div>
                        </div>
                        ${deadlineBadge}
                        <button class="btn-delete-task" onclick="window.appDeleteTask(${index})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    `;

                    DOM.taskListContainer.appendChild(taskEl);
                });
            }

            function addTask(title, subject, deadline) {
                const newTask = {
                    title,
                    subject,
                    deadline,
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                STATE.tasks.push(newTask);
                saveTasks();
                renderTasks();
            }

            function toggleTask(index) {
                STATE.tasks[index].completed = !STATE.tasks[index].completed;
                if (STATE.tasks[index].completed) {
                    triggerConfetti();
                }
                saveTasks();
                renderTasks();
            }

            function deleteTask(index) {
                STATE.tasks.splice(index, 1);
                saveTasks();
                renderTasks();
            }

            function saveTasks() {
                localStorage.setItem('app_tasks', JSON.stringify(STATE.tasks));
            }

            /* Smart Deadline Helper Functions */
            function getDeadlineBadge(deadlineString) {
                const now = new Date();
                const deadline = new Date(deadlineString);
                const diffHours = (deadline - now) / (1000 * 60 * 60);

                if (diffHours < 0) {
                    return `<span class="deadline-badge badge-red"><i class="fa-solid fa-triangle-exclamation"></i> Overdue</span>`;
                } else if (diffHours <= 24) {
                    return `<span class="deadline-badge badge-red"><i class="fa-solid fa-clock"></i> Due &lt; 24h</span>`;
                } else if (diffHours <= 72) {
                    return `<span class="deadline-badge badge-orange"><i class="fa-solid fa-clock"></i> Due &lt; 3 Days</span>`;
                } else {
                    return `<span class="deadline-badge badge-green"><i class="fa-solid fa-calendar"></i> Upcoming</span>`;
                }
            }

            function formatDeadline(deadlineString) {
                const date = new Date(deadlineString);
                return date.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            }

            function escapeHtml(str) {
                return str.replace(/[&<>"']/g, function(m) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
                });
            }

            function triggerConfetti() {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 40,
                        spread: 60,
                        origin: { y: 0.8 }
                    });
                }
            }

            // Expose globally for inline DOM click handlers
            window.appToggleTask = toggleTask;
            window.appDeleteTask = deleteTask;

            /* ==================================================================
               7. INITIALIZATION & EVENT BINDINGS
               ================================================================== */
            function bindEvents() {
                // Theme Toggle
                DOM.themeToggleBtn.addEventListener('click', toggleTheme);

                // Timer Controls
                DOM.timerStartBtn.addEventListener('click', startTimer);
                DOM.timerResetBtn.addEventListener('click', resetTimer);
                DOM.timerModeBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => switchTimerMode(e.target.dataset.mode));
                });

                // Task Form Submit
                DOM.taskForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const title = DOM.taskTitleInput.value.trim();
                    const subject = DOM.taskSubjectInput.value;
                    const deadline = DOM.taskDeadlineInput.value;

                    if (title && subject && deadline) {
                        addTask(title, subject, deadline);
                        DOM.taskForm.reset();
                    }
                });
            }

            function init() {
                initTheme();
                setupUserEditing();
                updateClockAndGreeting();
                setInterval(updateClockAndGreeting, 1000);

                renderTimer();
                initAmbientSounds();
                renderTasks();
                bindEvents();
            }

            // Run application once DOM is fully parsed
            document.addEventListener('DOMContentLoaded', init);

        })();
    </script>
</body>
</html>
